name: G.I Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gi-apk-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build engine
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download uploaded project ZIP from repository
        run: |
          test -f incoming/project.zip || { echo "::error::incoming/project.zip missing. Upload a project ZIP from G.I APK Builder first."; exit 1; }
          mkdir -p work
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("incoming/project.zip")
          bad=z.testzip()
          if bad:
              raise SystemExit(f"Invalid ZIP member: {bad}")
          z.extractall("work")
          PY

      - name: Locate Gradle Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          if [[ -f work/settings.gradle || -f work/settings.gradle.kts ]]; then ROOT="work"; fi
          if [[ -z "$ROOT" ]]; then
            while IFS= read -r -d '' f; do
              d="$(dirname "$f")"
              if [[ -f "$d/settings.gradle" || -f "$d/settings.gradle.kts" ]]; then ROOT="$d"; break; fi
            done < <(find work -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print0)
          fi
          if [[ -z "$ROOT" ]]; then echo "::error::Could not find settings.gradle(.kts) in uploaded ZIP."; exit 1; fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"

      - name: Validate project
        run: |
          test -f "${{ steps.locate.outputs.root }}/gradlew" || echo "No Gradle wrapper found; using installed Gradle."
          test -f "${{ steps.locate.outputs.root }}/build.gradle" -o -f "${{ steps.locate.outputs.root }}/build.gradle.kts" || {
            echo "::error::Root build.gradle(.kts) not found."; exit 1;
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.root }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
            ./gradlew --no-daemon assembleRelease || echo "Release variant unavailable; debug APK will still be provided."
          else
            gradle --no-daemon assembleDebug
            gradle --no-daemon assembleRelease || echo "Release variant unavailable; debug APK will still be provided."
          fi

      - name: Prepare artifact
        shell: bash
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . -path '*/build/outputs/apk/*' -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          if ! find "$GITHUB_WORKSPACE/out" -name '*.apk' -type f | grep -q .; then
            echo "::error::No APK was generated. Check the Gradle build log."
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gi-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7
